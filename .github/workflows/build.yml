name: App bauen

on:
  push:
    branches-ignore:
      - build-log
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signatur-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signatur-Schlüssel hinterlegt – Updates lassen sich dann nicht über die alte Version installieren."
          fi

      - name: App bauen
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Mamas-Telefon.apk
          gh release create "v${{ github.run_number }}" Mamas-Telefon.apk \
            --target "${{ github.sha }}" \
            --title "Mamas Telefon – Version ${{ github.run_number }}" \
            --notes "Auf dem Handy die Datei Mamas-Telefon.apk antippen und installieren." \
            --latest

      - name: Build-Log sichern (nur bei Fehler)
        if: failure()
        run: |
          if [ -f build.log ]; then cp build.log "$RUNNER_TEMP/build.log"; else echo "Kein Log vorhanden" > "$RUNNER_TEMP/build.log"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rfq . || true
          cp "$RUNNER_TEMP/build.log" build.log
          git add build.log
          git commit -qm "Build-Log Lauf ${{ github.run_number }}"
          git push -f origin build-log
