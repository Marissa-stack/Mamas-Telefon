plugins {
    id 'com.android.application'
}

// Versionsnummer zählt bei jedem Bau auf GitHub automatisch hoch,
// damit sich neue Versionen einfach über die alte installieren lassen.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

// Fester Signatur-Schlüssel, damit sich neue Versionen über die alte installieren
// lassen und Einstellungen und Kontakte erhalten bleiben.
def keystoreFile = rootProject.file("signing/mamas-telefon.p12")
def passwordFile = rootProject.file("signing/passwort.txt")
def hasKeystore = keystoreFile.exists() && passwordFile.exists()

android {
    namespace 'de.familie.mamastelefon'
    compileSdk 35

    defaultConfig {
        applicationId 'de.familie.mamastelefon'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile keystoreFile
                storeType 'pkcs12'
                storePassword passwordFile.text.trim()
                keyAlias 'mama'
                keyPassword passwordFile.text.trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
